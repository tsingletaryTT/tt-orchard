# tt-orchard bringup defaults for a QuietBox 2 with the Qwen3.8-27B coder on all four chips, written by
# `scripts/setup.sh --coder 27b`. Edit freely; setup never overwrites it.
runs_root = "@RUNS_ROOT@"
required_chips = "2,4"
# Stage 4 drafts its 4-chip configuration with this container package (several installed ones serve
# Qwen/Qwen3.8-27B on a QuietBox 2); the stage 4 skill has pinned it since 2026-10-03.
four_chip_package = "changh95/qwen3.8-27b-p300x2"
reference_python = "@REFERENCE_PYTHON@"
@SKILLS_LINE@
[env]
HF_HUB_OFFLINE = "1"

[coder]
target = "mando2222/qwen3.8-27b-dflash2-p300x2-q4kv"
kind = "container"
profile = "batch8-dflash2"
port = 8000
chips = 4
