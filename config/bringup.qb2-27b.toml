# tt-orchard bringup defaults for a QuietBox 2 with the Qwen3.8-27B coder on all four chips, written by
# `scripts/setup.sh --coder 27b`. Edit freely; setup never overwrites it.
runs_root = "@RUNS_ROOT@"
required_chips = "2,4"
reference_python = "@REFERENCE_PYTHON@"
@SKILLS_LINE@
[env]
HF_HUB_OFFLINE = "1"

[coder]
target = "mando2222/qwen3.8-27b-dflash2-p300x2-q4kv"
kind = "container"
profile = "batch8-dflash2"
port = 8000
chips = 4
